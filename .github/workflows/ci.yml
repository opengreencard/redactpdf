name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: redaction_test
          MARIADB_PASSWORD: redaction
          MARIADB_ROOT_PASSWORD: redaction-root
          MARIADB_USER: redaction
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_MODE: test
      DB_HOST: 127.0.0.1
      DB_DATABASE: redaction_test
      DB_USER: redaction
      DB_PASS: redaction
      AUTH_SECRET: ci-only-secret
      # Jest globalSetup only recreates tables when this is set. The MariaDB
      # service starts empty, so CI tests fail with table-not-found errors
      # without it.
      SETUP_TEST_DB: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn jest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Keep image in sync with k8s/templates/cluster.template.yml,
          # k8s/update-deployment.sh, and the build-image job below.
          tags: opengreencard/redactpdf:ci

  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: opengreencard/redactpdf:${{ github.sha }}
