<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig settings for pdftoppm. pdfTools.ts sets FONTCONFIG_FILE to this
  file and builds the cache in /tmp/redaction-fontconfig before the first
  render. Setting FONTCONFIG_FILE replaces the default config, so this file
  loads the system config itself (see the includes at the end).
-->
<fontconfig>
  <!--
    Use this cache instead of the system cache. The scan rules below only take
    effect through a cache built with this file.

    Keep in sync with `fontCacheDirectory` in pdfTools.ts.
  -->
  <cachedir>/tmp/redaction-fontconfig</cachedir>

  <!--
    Let each installed font answer to its PostScript name. Poppler sends PDF
    font names such as TimesNewRomanPSMT, but fontconfig only matches family
    names, so without this those names fall back to sans-serif.
  -->
  <match target="scan">
    <edit name="family" mode="append"><name>postscriptname</name></edit>
  </match>

  <!--
    Poppler strips the style from a bold or italic PostScript name and asks
    fontconfig for the stem instead. For example:

    - TimesNewRomanPS-BoldMT -> asks for family "TimesNewRomanPS" (weight bold)
    - CourierNewPS-ItalicMT -> asks for "CourierNewPS" (slant italic)

    fontconfig can't cut a string, so pdfTools.ts writes one alias rule per
    stem (the part before the first dash) to this file.

    Keep in sync with `writeStemAliases` in pdfTools.ts.
  -->
  <include ignore_missing="yes">/tmp/redaction-fontconfig/style-stems.conf</include>

  <!-- Production sidecar (Debian). -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Local dev on macOS with Homebrew (Apple silicon and Intel). -->
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
</fontconfig>
