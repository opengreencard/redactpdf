# Let's Encrypt ClusterIssuer for cert-manager.
# Issues TLS certificates for all ingresses using the nginx ingress class.
#
# Keep ACME_EMAIL in sync with k8s/variables.sh.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer
spec:
  acme:
    email: %ACME_EMAIL%
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-private-key
    solvers:
      - http01:
          ingress:
            class: nginx
