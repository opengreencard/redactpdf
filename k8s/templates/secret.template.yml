# This is a template for the Kubernetes Secret containing sensitive
# configuration values. Non-sensitive production configuration is loaded from
# .env.production, which is included in the Docker image.
#
# Use k8s/1password/fill-secrets-template.sh to create the filled secret at
# k8s/config/secret.yml (gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: redaction-env
  namespace: default
type: Opaque
stringData:
  DB_PASS: %DB_PASS%
  NEXTAUTH_SECRET: %NEXTAUTH_SECRET%
  AUTH_SECRET: %AUTH_SECRET%
  GOOGLE_CLIENT_ID: %GOOGLE_CLIENT_ID%
  GOOGLE_CLIENT_SECRET: %GOOGLE_CLIENT_SECRET%
  S3_ACCESS_KEY_ID: %S3_ACCESS_KEY_ID%
  S3_SECRET_ACCESS_KEY: %S3_SECRET_ACCESS_KEY%
  # SMTP credentials are stored in the Production 1Password vault.
  SMTP_USER: %SMTP_USER%
  SMTP_PASSWORD: %SMTP_PASSWORD%
