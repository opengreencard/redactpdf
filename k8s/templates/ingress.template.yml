# Ingress configuration for the redaction app.
#
# Routes traffic from redactpdf.ai and www.redactpdf.ai (redirected)
# to the redaction Service. TLS certificates are managed by cert-manager.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redaction-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    nginx.ingress.kubernetes.io/load-balance: ewma
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # Keep the apex host in sync with NEXTAUTH_URL in
    # k8s/templates/cluster.template.yml.
    nginx.ingress.kubernetes.io/from-to-www-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # Both names must be on the certificate for HTTPS www→apex redirects.
        # Keep hosts in sync with k8s/variables.sh (DOMAIN).
        - '%DOMAIN%'
        - 'www.%DOMAIN%'
      secretName: redaction-tls
  rules:
    # Only the apex host is listed. from-to-www-redirect adds the www server.
    - host: '%DOMAIN%'
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: redaction
                port:
                  number: 3000
