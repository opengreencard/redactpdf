# Cluster configuration: Deployments + Service for the redaction app.
#
# This template is filled by k8s/fill-templates.sh. Non-sensitive values are
# hardcoded in the Deployment's env block. Sensitive values come from the
# redaction-env Secret via envFrom.
#
# Comments with "Keep in sync" indicate literal strings that must match across
# multiple committed files. Template-substituted values (%VAR%) do not need
# these comments since they all come from k8s/variables.sh.

apiVersion: v1
kind: List
metadata: {}
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: redaction
      namespace: default
    spec:
      type: ClusterIP
      ports:
        - port: 3000
          targetPort: 3000
          name: http
      selector:
        app: redaction

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redaction
      namespace: default
    spec:
      replicas: %REPLICAS%
      selector:
        matchLabels:
          app: redaction
      template:
        metadata:
          labels:
            app: redaction
        spec:
          <<: &commonSpec
            imagePullSecrets:
              - name: regcred
            terminationGracePeriodSeconds: 30
          containers:
            - <<: &commonContainer
                # Keep image in sync with GitHub Actions workflow (build-image job) and
                # k8s/update-deployment.sh.
                image: opengreencard/redactpdf:%REVISION%
                env:
                  - &commonNodeEnv
                    name: NODE_ENV
                    value: production
                  - &commonAppMode
                    name: APP_MODE
                    value: production
                # Secrets stay out of this template. They're injected from the
                # redaction-env Secret.
                envFrom:
                  - secretRef:
                      name: redaction-env
                resources:
                  requests:
                    memory: '1G'
                    cpu: 1
                  limits:
                    memory: '2G'
              name: redaction
              ports:
                - containerPort: 3000
                  name: http
              env:
                - *commonNodeEnv
                - *commonAppMode

                # Non-sensitive production configuration (DB_HOST, DB_PORT,
                # DB_USER, DB_DATABASE, and S3_BUCKET_PREFIX) is loaded from
                # .env.production.nonsecret, which is committed and copied
                # into the Docker image.
                #
                # This remains an explicit deployment override because it
                # must match the cluster's configured domain.
                - name: NEXTAUTH_URL
                  value: https://%DOMAIN%
              readinessProbe:
                httpGet:
                  path: /
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /
                  port: 3000
                initialDelaySeconds: 30
                periodSeconds: 30
            - name: pdf-renderer
              # Same image as the app, which has Ghostscript and
              # pdf-renderer/bin/www.ts. Keep in sync with the other sidecar in
              # this file and the `pdf-renderer` script in package.json.
              #
              # No envFrom Secret, so Ghostscript never sees app secrets. The
              # app reaches it at PDF_RENDERER_URL (see .env.production.nonsecret).
              image: opengreencard/redactpdf:%REVISION%
              command:
                - node
                - -r
                - '@swc-node/register'
                - pdf-renderer/bin/www.ts
              env:
                # The root filesystem is read-only, and @swc/core caches its
                # native binary under HOME. Point HOME at the /tmp emptyDir.
                # That only works because a plain emptyDir isn't mounted
                # noexec.
                - name: HOME
                  value: /tmp
              ports:
                - containerPort: 4100
                  name: pdf-renderer
              resources:
                requests:
                  memory: '256M'
                  cpu: '250m'
                limits:
                  memory: '1G'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: pdf-renderer-tmp
                  mountPath: /tmp
              # The renderer binds to 127.0.0.1, so kubelet's httpGet probes
              # (which target the pod IP) get "connection refused". Run the
              # probe inside the container instead.
              readinessProbe:
                exec:
                  command:
                    - node
                    - -e
                    - "fetch('http://127.0.0.1:4100/health', { signal: AbortSignal.timeout(2000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
                initialDelaySeconds: 2
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                exec:
                  command:
                    - node
                    - -e
                    - "fetch('http://127.0.0.1:4100/health', { signal: AbortSignal.timeout(2000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 3

          volumes:
            - name: pdf-renderer-tmp
              emptyDir: {}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redaction-background-worker
      namespace: default
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: redaction-background-worker
      template:
        metadata:
          labels:
            app: redaction-background-worker
        spec:
          <<: *commonSpec
          containers:
            - <<: *commonContainer
              name: redaction-background-worker
              command:
                - node
                - -r
                - '@swc-node/register'
                - scripts/workers/redactionBackgroundWorker.ts
              resources:
                requests:
                  memory: '256M'
                  cpu: '100m'
                limits:
                  memory: '512M'
            - name: pdf-renderer
              # Same image as the app, which has Ghostscript and
              # pdf-renderer/bin/www.ts. Keep in sync with the other sidecar in
              # this file and the `pdf-renderer` script in package.json.
              #
              # No envFrom Secret, so Ghostscript never sees app secrets. The
              # app reaches it at PDF_RENDERER_URL (see .env.production.nonsecret).
              image: opengreencard/redactpdf:%REVISION%
              command:
                - node
                - -r
                - '@swc-node/register'
                - pdf-renderer/bin/www.ts
              env:
                # The root filesystem is read-only, and @swc/core caches its
                # native binary under HOME. Point HOME at the /tmp emptyDir.
                # That only works because a plain emptyDir isn't mounted
                # noexec.
                - name: HOME
                  value: /tmp
              ports:
                - containerPort: 4100
                  name: pdf-renderer
              resources:
                requests:
                  memory: '256M'
                  cpu: '250m'
                limits:
                  memory: '1G'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: pdf-renderer-tmp
                  mountPath: /tmp
              # The renderer binds to 127.0.0.1, so kubelet's httpGet probes
              # (which target the pod IP) get "connection refused". Run the
              # probe inside the container instead.
              readinessProbe:
                exec:
                  command:
                    - node
                    - -e
                    - "fetch('http://127.0.0.1:4100/health', { signal: AbortSignal.timeout(2000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
                initialDelaySeconds: 2
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                exec:
                  command:
                    - node
                    - -e
                    - "fetch('http://127.0.0.1:4100/health', { signal: AbortSignal.timeout(2000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 3
          volumes:
            - name: pdf-renderer-tmp
              emptyDir: {}
